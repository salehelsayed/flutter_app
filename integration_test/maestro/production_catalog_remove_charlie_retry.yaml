appId: ${APP_ID}
name: production_catalog_remove_charlie_retry
---
- assertVisible: Group Info
- scrollUntilVisible:
    element:
      id: 'group-member-remove-${CHARLIE_PEER_ID}'
    direction: DOWN
- tapOn:
    id: 'group-member-remove-${CHARLIE_PEER_ID}'
- assertVisible: 'Remove Journeycharlie from the group\?'
- tapOn: Remove
# The removal may first wait (up to 20 s) for a group recovery pass.
- extendedWaitUntil:
    visible: '(?s)^.*\n2 members\n.*$'
    timeout: 45000
- assertNotVisible:
    id: 'group-member-remove-${CHARLIE_PEER_ID}'
