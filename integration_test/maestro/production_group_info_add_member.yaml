appId: ${APP_ID}
name: production_group_info_add_member
---
- tapOn: Group information
- assertVisible: Group Info
- scrollUntilVisible:
    element:
      id: group-info-add-member
    direction: DOWN
- tapOn:
    id: group-info-add-member
- tapOn: '(?s)^${CONTACT_NAME}\n.*$'
- assertVisible: 'Add Members \(1\)'
- tapOn: Send Invites
# The add may first wait (up to 20 s) for a group recovery pass.
- extendedWaitUntil:
    visible: Group Info
    timeout: 45000
- back
- assertVisible:
    id: chat_composer
