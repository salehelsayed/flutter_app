appId: ${APP_ID}
name: production_catalog_react_media
---
# production_catalog_react for an image message: the caption and the reaction
# chip are separate elements of the media bubble, so the chip is checked on
# screen rather than inside the caption's element.
- assertVisible: '(?s)^.*\n${MESSAGE_PATTERN}\n.*$'
- longPressOn: '(?s)^.*\n${MESSAGE_PATTERN}\n.*$'
- tapOn:
    id: message_reaction_more
- assertVisible: Travel
- swipe:
    from:
      text: Travel
    direction: LEFT
- tapOn: Symbols
- tapOn: '🔥'
- assertVisible:
    id: chat_composer
- assertVisible: '(?s)^.*🔥.*$'
