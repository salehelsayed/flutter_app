appId: ${APP_ID}
name: production_group_info_dissolve
---
- tapOn: Group information
- assertVisible: Group Info
- scrollUntilVisible:
    element: '^Dissolve Group$'
    direction: DOWN
- tapOn: '^Dissolve Group$'
- tapOn: '^Dissolve$'
# The dissolve may first wait for a group recovery pass.
- extendedWaitUntil:
    visible: Group dissolved
    timeout: 45000
