appId: ${APP_ID}
name: production_group_send
---
- assertVisible:
    id: orbit.view.inner_circle
- tapOn:
    id: orbit.group.${GROUP_ID}
- tapOn:
    id: chat_composer
- inputText: ${MESSAGE}
- tapOn:
    id: chat_send
- assertVisible: '(?s)^.*\n${MESSAGE_PATTERN}\n.*$'
# The first Back may only close the keyboard left open by the send. Some
# devices' hideKeyboard already leaves the chat, so it is not used here.
- repeat:
    times: 2
    while:
      notVisible:
        id: orbit.view.inner_circle
    commands:
      - back
- assertVisible:
    id: orbit.view.inner_circle
