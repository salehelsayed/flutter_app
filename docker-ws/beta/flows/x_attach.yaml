appId: com.mknoon.app
name: explore - open the attach sheet, then the media library (STEP=sheet|library)
---
- runFlow: ensure_chat.yaml
- tapOn: "Add attachment"
- runFlow: { file: sleep.yaml, env: { MS: 2000 } }
- takeScreenshot: x_attach_sheet_${DEV}
- runFlow:
    when: { true: "${STEP == 'library'}" }
    commands:
      - tapOn: "Media Library"
      - runFlow: { file: sleep.yaml, env: { MS: 6000 } }
      - takeScreenshot: x_media_library_${DEV}
