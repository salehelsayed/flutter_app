appId: com.mknoon.app
name: T15 Pixel unblocks from the chat list if still blocked, then looks for the message sent after the unblock
---
- runFlow: t15_unblock_list_android.yaml
- runFlow: ../ensure_chat.yaml
- extendedWaitUntil: { visible: ".*T15 after unblock ${NONCE}.*", timeout: 180000 }
- runFlow: { file: ../sleep.yaml, env: { MS: 5000 } }
- takeScreenshot: t15_after_unblock
