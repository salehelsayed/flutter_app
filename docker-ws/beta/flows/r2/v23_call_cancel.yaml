appId: com.mknoon.app
name: R2-3 caller calls, lets it ring 12 s, cancels
---
# A new iOS Maestro session starts its driver app, which sends Mknoon to the background:
# ensure_chat brings the app and the 1:1 chat back first.
- runFlow: ../ensure_chat.yaml
- extendedWaitUntil: { visible: "Start voice call", timeout: 90000 }
- tapOn: "Start voice call"
- extendedWaitUntil: { visible: "Cancel call", timeout: 60000 }
- runFlow: { file: ../sleep.yaml, env: { MS: 12000 } }
- takeScreenshot: v23_caller_ringing
- tapOn: "Cancel call"
- runFlow: { file: ../sleep.yaml, env: { MS: 3000 } }
- runFlow: end_if_any.yaml
