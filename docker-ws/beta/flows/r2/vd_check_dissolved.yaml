appId: com.mknoon.app
name: R2-1 validation - the member sees GROUP dissolved (read-only)
---
- runFlow: { file: open_group.yaml, env: { GROUP: "${GROUP}", GTIMEOUT: 60000 } }
- extendedWaitUntil: { visible: ".*[Dd]issolved.*", timeout: 240000 }
- runFlow: { file: ../sleep.yaml, env: { MS: 2000 } }
- takeScreenshot: vd_dissolved_member_${DEV}
