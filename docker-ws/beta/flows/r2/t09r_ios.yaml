- runFlow: { file: ../send_text.yaml, env: { MSG: "T09 emoji 😀🎉👍🏽❤️ ${NONCE}" } }
- runFlow: { file: send.yaml, env: { MSG: "T09 url https://example.com/r2?q=${NONCE}&x=1 ${NONCE}" } }
