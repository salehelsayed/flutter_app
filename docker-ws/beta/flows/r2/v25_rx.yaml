appId: com.mknoon.app
name: R2-4b receiver waits for the message with caption TEXT, lets the media load, screenshots it
---
- runFlow: ../ensure_chat.yaml
- extendedWaitUntil: { visible: ".*${TEXT}.*", timeout: 300000 }
- runFlow: ../kb_hide.yaml
- runFlow: { file: ../sleep.yaml, env: { MS: 25000 } }
- takeScreenshot: v25_received
