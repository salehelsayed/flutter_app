appId: com.mknoon.app
name: R2-4 attach one Photos item (PHPicker); the grid-point fallback runs only when neither Send nor Processing shows
---
- runFlow: ../kb_hide.yaml
- tapOn: "Add attachment"
- tapOn: "Media Library"
- extendedWaitUntil: { visible: "Cancel", timeout: 12000, optional: true }
- runFlow:
    when: { visible: "Cancel" }
    commands:
      - tapOn:
          text: "${ITEM}"
          index: ${IDX}
      - runFlow:
          when: { visible: "Add|Done" }
          commands: [ { tapOn: "Add|Done" } ]
- runFlow: { file: ../sleep.yaml, env: { MS: 3000 } }
- runFlow:
    when: { notVisible: "Send message|Processing.*" }
    commands:
      - takeScreenshot: pick_ios_fallback
      - tapOn: { point: "${PX}" }
      - runFlow: { file: ../sleep.yaml, env: { MS: 1500 } }
      - tapOn: { point: "90%,12%" }
