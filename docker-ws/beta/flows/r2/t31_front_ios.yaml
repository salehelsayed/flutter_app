appId: com.mknoon.app
name: T31 iPhone returns to the app during the call attempt
---
- launchApp: { stopApp: false }
- runFlow: { file: ../sleep.yaml, env: { MS: 5000 } }
- takeScreenshot: t31_ios_front
- runFlow:
    when: { visible: "Answer" }
    commands:
      - tapOn: "Answer"
      - extendedWaitUntil: { visible: "(.*\\n)?Connected(\\n.*)?", timeout: 60000 }
      - takeScreenshot: t31_ios_connected
      - runFlow: ../end_call.yaml
- runFlow: { file: ../sleep.yaml, env: { MS: 30000 } }
- takeScreenshot: t31_ios_end
