appId: com.mknoon.app
name: R2-4b attach FILE1 + FILE2 (Android picker, multi-select) - no wait for Send message
---
- runFlow: ../kb_hide.yaml
- tapOn: "Add attachment"
- tapOn: "Media Library"
- extendedWaitUntil: { visible: "${FILE1}", timeout: 30000 }
- longPressOn: "${FILE1}"
- tapOn: "${FILE2}"
- tapOn: "Select|SELECT|Done|DONE|Open|OPEN"
- runFlow: { file: ../sleep.yaml, env: { MS: 3000 } }
