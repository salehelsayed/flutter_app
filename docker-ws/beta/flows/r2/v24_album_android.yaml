appId: com.mknoon.app
name: R2-4 Pixel sends two photos and the 7 s video; waits for processing to end (or the stall notice), then sends
---
- runFlow: ../ensure_chat.yaml
- runFlow: { file: v24_pick_android_multi.yaml, env: { FILE1: "r2_photo_2.png", FILE2: "r2_photo_3.png", FILE3: "r2_video_1.mp4" } }
- takeScreenshot: v24_pending
- extendedWaitUntil: { notVisible: "Processing.*", timeout: 420000 }
- takeScreenshot: v24_processed
- runFlow:
    when: { visible: "Video processing stopped.*" }
    commands:
      - takeScreenshot: v24_stall_notice
      - tapOn: "Retry"
      - runFlow: { file: ../sleep.yaml, env: { MS: 3000 } }
      - extendedWaitUntil: { notVisible: "Processing.*", timeout: 420000 }
      - takeScreenshot: v24_after_retry
- runFlow: { file: caption_send.yaml, env: { MSG: "R24 album ${NONCE}" } }
- extendedWaitUntil: { visible: ".*R24 album ${NONCE}.*", timeout: 120000 }
- runFlow: { file: ../sleep.yaml, env: { MS: 15000 } }
- takeScreenshot: v24_sent
