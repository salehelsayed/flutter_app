appId: com.mknoon.app
name: T26 both phones start a call to each other at START_MS
---
- runFlow: ../ensure_chat.yaml
- extendedWaitUntil: { visible: "Start voice call", timeout: 60000 }
- repeat:
    while: { true: "${Date.now() < Number(START_MS) - 2500}" }
    commands: [ { runFlow: { file: ../sleep.yaml, env: { MS: 1000 } } } ]
- evalScript: ${ (function(){ var t = Number(START_MS); while (Date.now() < t) {} })() }
- tapOn: "Start voice call"
- runFlow: { file: ../sleep.yaml, env: { MS: 20000 } }
- takeScreenshot: t26_20s_${DEV}
- runFlow: { file: ../sleep.yaml, env: { MS: 15000 } }
- takeScreenshot: t26_35s_${DEV}
- runFlow: end_if_any.yaml
- runFlow: { file: ../sleep.yaml, env: { MS: 5000 } }
- runFlow: end_if_any.yaml
- takeScreenshot: t26_end_${DEV}
