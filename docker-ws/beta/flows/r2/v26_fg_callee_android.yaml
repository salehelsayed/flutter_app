appId: com.mknoon.app
name: R2-6 Pixel (app in the foreground, chat open) - incoming call, shade shows the call notification, answer
---
- runFlow: ../ensure_chat.yaml
- extendedWaitUntil: { visible: "Answer|ANSWER", timeout: 180000 }
- runFlow: { file: ../sleep.yaml, env: { MS: 2500 } }
- takeScreenshot: v26_fg_ringing
- swipe: { start: "50%,1%", end: "50%,70%" }
- runFlow: { file: ../sleep.yaml, env: { MS: 2000 } }
- takeScreenshot: v26_fg_ringing_shade
- pressKey: Back
- runFlow: { file: ../sleep.yaml, env: { MS: 1500 } }
- tapOn: "Answer|ANSWER"
- extendedWaitUntil: { visible: "(.*\\n)?Connected(\\n.*)?", timeout: 60000 }
- takeScreenshot: v26_fg_connected
- swipe: { start: "50%,1%", end: "50%,70%" }
- runFlow: { file: ../sleep.yaml, env: { MS: 2000 } }
- takeScreenshot: v26_fg_ongoing_shade
- pressKey: Back
- extendedWaitUntil: { notVisible: "End", timeout: 120000 }
