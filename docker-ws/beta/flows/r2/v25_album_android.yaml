appId: com.mknoon.app
name: R2-4b Pixel sends two photos + VIDEO; waits for processing to end, then sends with caption
---
- runFlow: ../ensure_chat.yaml
- runFlow: { file: v24_pick_android_multi.yaml, env: { FILE1: "r2_photo_2.png", FILE2: "r2_photo_3.png", FILE3: "${VIDEO}" } }
- takeScreenshot: v25_pending
- extendedWaitUntil: { notVisible: "(?s)Processing.*", timeout: 420000 }
- runFlow: { file: ../sleep.yaml, env: { MS: 2000 } }
- takeScreenshot: v25_processed
- runFlow: { file: caption_send.yaml, env: { MSG: "R25 album ${NONCE}" } }
- runFlow: ../kb_hide.yaml
- runFlow: { file: ../sleep.yaml, env: { MS: 8000 } }
- takeScreenshot: v25_sent
