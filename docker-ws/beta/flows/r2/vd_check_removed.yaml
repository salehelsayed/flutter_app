appId: com.mknoon.app
name: R2-1 validation - the member sees it was removed from GROUP
---
- runFlow: { file: open_group.yaml, env: { GROUP: "${GROUP}", GTIMEOUT: 60000 } }
- extendedWaitUntil: { visible: ".*removed.*|.*no longer in this group.*|.*Delete from Device.*", timeout: 240000 }
- runFlow: { file: ../sleep.yaml, env: { MS: 2000 } }
- takeScreenshot: vd_removed_member_${DEV}
