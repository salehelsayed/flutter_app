appId: com.mknoon.app
name: T21 Pixel accepts the new invite and writes in the group
---
- runFlow: home_list.yaml
- extendedWaitUntil: { visible: "[0-9]+ items? pending.*", timeout: 300000 }
- tapOn: "[0-9]+ items? pending.*"
- runFlow: { file: ../sleep.yaml, env: { MS: 2500 } }
- takeScreenshot: t21_intros
- tapOn: "Accept"
- runFlow: { file: ../sleep.yaml, env: { MS: 4000 } }
- runFlow:
    when: { visible: "All.*" }
    commands: [ { tapOn: "All.*" } ]
- tapOn: ".*R2 (Group|Renamed|By Pixel) ${NONCE}.*"
- extendedWaitUntil: { visible: "Group information", timeout: 20000 }
- runFlow: { file: ../sleep.yaml, env: { MS: 5000 } }
- runFlow: { file: ../send_text.yaml, env: { MSG: "T21 back ${NONCE}" } }
- takeScreenshot: t21_back_android
