appId: com.mknoon.app
name: S05c Pixel calls again right after the decline, talks 10s, hangs up
---
- runFlow: ensure_chat.yaml
- tapOn: "Start voice call"
- runFlow: { file: sleep.yaml, env: { MS: 2500 } }
- takeScreenshot: s05c_calling_android
- extendedWaitUntil: { visible: "(.*\\n)?Connected(\\n.*)?", timeout: 90000 }
- runFlow: { file: sleep.yaml, env: { MS: 10000 } }
- assertVisible: "(.*\\n)?Connected(\\n.*)?"
- runFlow: end_call.yaml
- runFlow: { file: sleep.yaml, env: { MS: 3000 } }
- takeScreenshot: s05c_after_end_android
- runFlow: ensure_chat.yaml
