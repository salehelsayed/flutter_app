appId: com.mknoon.app
name: S04 iPhone records and sends a 4s voice note, then waits for the Pixel's voice note
---
- runFlow: ensure_chat.yaml
- tapOn: "Record voice message.*"
- runFlow: { file: sleep.yaml, env: { MS: 4000 } }
- takeScreenshot: s04_recording_ios
- tapOn: "Stop and send voice message.*"
- runFlow: { file: sleep.yaml, env: { MS: 5000 } }
- takeScreenshot: s04_sent_ios
- extendedWaitUntil: { visible: "${ANDROID_VOICE_RX}", timeout: 120000 }
- takeScreenshot: s04_got_voice_ios
