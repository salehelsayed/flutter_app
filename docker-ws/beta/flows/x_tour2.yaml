appId: com.mknoon.app
name: explore - settings screens
---
- launchApp: { stopApp: false }
- repeat:
    times: 4
    while: { notVisible: "Open settings" }
    commands: [ { runFlow: go_back.yaml } ]
- tapOn: { text: "Open settings", optional: true }
- runFlow: { file: sleep.yaml, env: { MS: 2500 } }
- takeScreenshot: s1_settings
- scroll
- takeScreenshot: s2_settings_scrolled
