appId: com.mknoon.app
name: g406_send_text
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: orbit_create_group_fab
    timeout: 30000
- runFlow:
    when:
      visible:
        id: orbit.view.all_chats
    commands:
      - tapOn:
          id: orbit.view.all_chats
- tapOn:
    id: orbit.contact.${PEER_ID}
- assertVisible:
    id: chat_composer
- tapOn:
    id: chat_composer
- inputText: ${TEXT}
- tapOn:
    id: chat_send
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: sent
- back
