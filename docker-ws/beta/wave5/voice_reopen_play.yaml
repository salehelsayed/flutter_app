appId: com.mknoon.app
name: voice_reopen_play
---
- back
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible:
        id: orbit.view.all_chats
    commands:
      - tapOn:
          id: orbit.view.all_chats
- tapOn:
    id: orbit.contact.${PEER_ID}
- assertVisible:
    id: chat_composer
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 7_reopened
- tapOn:
    point: 32%, 78%
- swipe:
    start: 50%, 15%
    end: 51%, 15%
    duration: 1500
- takeScreenshot: 8_reopen_play_plus_1s
- swipe:
    start: 50%, 15%
    end: 51%, 15%
    duration: 2500
- takeScreenshot: 9_reopen_play_plus_4s
