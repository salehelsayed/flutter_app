<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orbit3 — Scalability Prototypes (interactive preview)</title>
<style>
  :root{
    --green:#1ED760; --teal:#81E6D9; --teal2:#4ECDC4; --gold:#FFF1C0; --coral:#FF6B6B;
    --ink:#EAF2F1; --muted:#8FA3A0; --glass:rgba(20,30,34,0.55); --glass-border:rgba(255,255,255,0.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#0a0f12;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:14px;
    padding:22px 14px 40px;min-height:100%;}
  h1{font-size:18px;font-weight:700;letter-spacing:-0.3px;margin:0;}
  .sub{font-size:12.5px;color:var(--muted);max-width:440px;text-align:center;line-height:1.45;margin:0;}
  .switcher{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .switcher button{border:1px solid var(--glass-border);background:rgba(255,255,255,0.05);color:var(--ink);
    padding:8px 14px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;transition:.18s;
    display:flex;flex-direction:column;align-items:center;gap:1px;}
  .switcher button small{font-weight:500;font-size:10px;color:var(--muted);}
  .switcher button.on{border-color:rgba(30,215,96,0.6);background:rgba(30,215,96,0.14);}
  .switcher button.on small{color:rgba(30,215,96,0.8);}
  .device{position:relative;width:390px;height:800px;border-radius:42px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 10px #16191c,0 0 0 11px #2a2f33;
    background:radial-gradient(120% 90% at 30% 10%,#163b40 0%,#0c1417 42%,#070b0d 100%);}
  .device::before,.device::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;pointer-events:none;}
  .device::before{width:340px;height:340px;left:-90px;top:90px;
    background:radial-gradient(circle,rgba(30,215,96,.25),transparent 70%);animation:drift1 16s ease-in-out infinite;}
  .device::after{width:300px;height:300px;right:-80px;bottom:120px;
    background:radial-gradient(circle,rgba(78,205,196,.22),transparent 70%);animation:drift2 19s ease-in-out infinite;}
  @keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}
  @keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,30px)}}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;gap:8px;padding:46px 12px 6px 16px;flex-wrap:wrap;z-index:5;}
  .brand{font-size:21px;font-weight:800;letter-spacing:-0.3px;}
  .chip{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.06);border-radius:12px;padding:5px 10px;font-size:12px;font-weight:600;
    cursor:pointer;color:var(--ink);white-space:nowrap;user-select:none;transition:.15s;}
  .chip.on{border-color:rgba(30,215,96,.55);background:rgba(30,215,96,.14);color:#bff4cf;}
  .badge{margin-left:auto;border:1px solid rgba(30,215,96,.4);background:rgba(30,215,96,.13);
    color:var(--green);font-size:10px;font-weight:700;padding:4px 9px;border-radius:11px;white-space:nowrap;}
  .stage{position:relative;flex:1;overflow:hidden;touch-action:none;}
  .navbar{height:58px;display:flex;align-items:center;justify-content:space-around;
    border-top:1px solid rgba(255,255,255,.07);background:rgba(8,12,14,.5);backdrop-filter:blur(8px);font-size:11px;}
  .navbar div{color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;}
  .navbar div.active{color:var(--green);}
  .av{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;
    color:#06110d;cursor:pointer;transition:transform .28s cubic-bezier(.2,.8,.2,1),width .28s,height .28s,
    opacity .28s,box-shadow .28s,font-size .28s;will-change:transform;transform:translate(-50%,-50%);overflow:visible;}
  .av .face{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .av.you{box-shadow:0 0 0 2px rgba(30,215,96,.9),0 0 22px rgba(30,215,96,.5);}
  .av.match{box-shadow:0 0 0 2px #fff,0 0 26px 4px rgba(30,215,96,.8) !important;z-index:30;}
  .av .lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;font-size:9.5px;
    font-weight:600;color:#eafffb;text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap;pointer-events:none;}
  .floatlbl{position:absolute;transform:translateX(-50%);font-size:9.5px;font-weight:600;color:#eafffb;
    text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none;}
  .ring{position:absolute;border-radius:50%;border:1.3px dashed rgba(129,230,217,.30);
    box-shadow:0 0 18px rgba(129,230,217,.07) inset;transform:translate(-50%,-50%);pointer-events:none;
    transition:width .28s,height .28s,opacity .28s,border-color .28s;}
  .node{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;
    background:var(--glass);border:1px solid rgba(30,215,96,.6);box-shadow:0 0 14px rgba(30,215,96,.3);
    display:flex;align-items:center;justify-content:center;color:var(--green);font-weight:800;font-size:11px;cursor:pointer;z-index:20;}
  .floatrow{position:absolute;left:12px;right:12px;top:10px;display:flex;gap:8px;align-items:center;z-index:25;}
  .pill{display:inline-flex;align-items:center;gap:5px;background:var(--glass);border:1px solid var(--glass-border);
    border-radius:13px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink);
    backdrop-filter:blur(10px);white-space:nowrap;}
  .pill.on{border-color:rgba(30,215,96,.5);background:rgba(30,215,96,.16);color:#bff4cf;}
  .hint{margin-left:auto;font-size:10px;color:var(--muted);background:var(--glass);border:1px solid var(--glass-border);
    padding:5px 8px;border-radius:10px;backdrop-filter:blur(8px);}
  .zoomers{position:absolute;left:12px;bottom:84px;display:flex;flex-direction:column;background:var(--glass);
    border:1px solid var(--glass-border);border-radius:14px;backdrop-filter:blur(10px);z-index:25;overflow:hidden;}
  .zoomers button{width:40px;height:40px;border:none;background:transparent;color:var(--ink);font-size:20px;cursor:pointer;}
  .zoomers button:first-child{border-bottom:1px solid var(--glass-border);}
  .recip{position:absolute;right:12px;top:10px;z-index:25;background:var(--glass);border:1px solid var(--glass-border);
    border-radius:11px;padding:6px 8px;backdrop-filter:blur(10px);font-size:8.5px;color:var(--muted);text-align:center;}
  .recip .bar{width:96px;height:6px;border-radius:3px;margin-bottom:3px;
    background:linear-gradient(90deg,var(--teal2),var(--gold),var(--coral));}
  .recip .ends{display:flex;justify-content:space-between;}
  .drawer{position:absolute;left:0;right:0;bottom:0;background:var(--glass);backdrop-filter:blur(18px);
    border-top:1px solid var(--glass-border);border-radius:22px 22px 0 0;z-index:28;
    transition:height .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;}
  .drawer .grab{width:38px;height:4px;border-radius:2px;background:rgba(143,163,160,.6);margin:8px auto 2px;cursor:grab;}
  .drawer .dhead{display:flex;align-items:center;gap:7px;padding:6px 14px 4px;font-size:13px;}
  .drawer .dhead b{font-weight:700;}
  .drawer .dhead .cnt{color:var(--muted);font-weight:600;}
  .drawer .dhead .dh{margin-left:auto;font-size:10px;color:var(--muted);}
  .drawer .search{margin:2px 12px 6px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);
    border-radius:11px;padding:7px 10px;}
  .drawer .search input{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font-size:13.5px;}
  .drawer .list{flex:1;overflow-y:auto;padding-bottom:14px;}
  .drow{display:flex;align-items:center;gap:11px;padding:8px 14px;cursor:pointer;}
  .drow:hover{background:rgba(255,255,255,.04);}
  .drow .da{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#06110d;font-size:14px;}
  .drow .meta{flex:1;min-width:0;}
  .drow .nm{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .drow .pv{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pinbtn{flex:none;border:1px solid rgba(30,215,96,.45);background:rgba(30,215,96,.14);color:var(--green);
    border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .empty{padding:30px 16px;text-align:center;color:var(--muted);font-size:13px;}
  .rail{position:absolute;right:8px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;
    gap:10px;z-index:20;align-items:flex-end;}
  .rail .t{width:8px;height:8px;border-radius:4px;background:rgba(143,163,160,.5);cursor:pointer;transition:.16s;}
  .rail .t.on{width:18px;background:var(--green);}
  .tierlabel{position:absolute;left:0;right:0;top:8px;display:flex;justify-content:center;z-index:20;pointer-events:none;}
  .tierlabel span{background:var(--glass);border:1px solid var(--glass-border);border-radius:13px;padding:6px 12px;
    font-size:11px;font-weight:600;color:#cfe;backdrop-filter:blur(10px);text-align:center;}
  .pop{position:absolute;z-index:60;background:#111a1d;border:1px solid var(--glass-border);border-radius:12px;
    box-shadow:0 12px 30px rgba(0,0,0,.5);overflow:hidden;min-width:150px;}
  .pop button{display:block;width:100%;text-align:left;border:none;background:transparent;color:var(--ink);
    padding:11px 14px;font-size:13px;cursor:pointer;}
  .pop button:hover{background:rgba(255,255,255,.06);}
  .pop button.warn{color:#ff9d9d;}
  .pop .nmh{padding:9px 14px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--glass-border);}
  .toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);background:#10181b;
    border:1px solid var(--glass-border);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:12.5px;
    opacity:0;transition:.25s;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .legend{font-size:11.5px;color:var(--muted);max-width:450px;line-height:1.55;text-align:center;}
</style>
</head>
<body>
  <h1>Orbit3 — scalability prototypes</h1>
  <p class="sub">Two directions for "the orbit stops being useful above ~25 friends", reproduced from the Flutter code (same geometry, mock people &amp; interactions). Switch with the buttons. Touch gestures are mapped to mouse (drag / scroll-wheel).</p>

  <div class="switcher" id="switcher">
    <button data-lab="classic"><span>Classic (today)</span><small>shows the &gt;25 break</small></button>
    <button data-lab="innerSky" class="on"><span>Inner + Sky + Drawer</span><small>recommended split</small></button>
    <button data-lab="fisheye"><span>Fisheye / Orbit-Climb</span><small>one orbit holds all</small></button>
  </div>

  <div class="device"><div class="screen">
    <div class="topbar" id="topbar"></div>
    <div class="stage" id="stage"></div>
    <div class="navbar">
      <div><span>◔</span>Feed</div><div><span>◑</span>Orbit</div>
      <div><span>◕</span>Orbit2</div><div class="active"><span>●</span>Orbit3</div>
    </div>
  </div></div>

  <p class="legend" id="legend"></p>

<script>
/* ---- mock population (mirrors orbit3_mock_data.dart) ---- */
const NAMES=["Layla","Karim","Mina","Tariq","Sara","Hadi","Dana","Faris","Rana","Sami","Lina","Zaid",
"Hana","Yara","Nael","Reem","Maya","Idris","Lena","Omar","Sofia","Yuki","Theo","Noor","Bao","Aria",
"Priya","Elena","Marcus","Jin","Salma","Tom","Nadia","Kofi","Ines","Rui","Vera","Hugo","Mira","Adam",
"Nora","Zane","Lila","Emir","Tahir","Kian","Roya","Sven","Yusuf","Dalia","Owen","Petra"];
const GROUPS=[{id:"g-trip",name:"Weekend Trip"},{id:"g-work",name:"Work Crew"}];
const POPS=[5,13,24,50];
const PREVIEWS=["coffee soon?","sent a photo","voice message","you: sounds good","haha yeah",
"see you there","thanks!","let me check","on my way","miss you"];

function hash(s,salt){let h=(0x811c9dc5^salt)>>>0;for(let i=0;i<s.length;i++){h=((h^s.charCodeAt(i))*0x01000193)>>>0;}return h&0x7fffffff;}
function h01(s,salt){return (hash(s,salt)%100000)/100000;}
function buildPop(count){
  const n=Math.max(0,Math.min(count,NAMES.length+2));
  const gc=n>=14?2:0, fc=n-gc, out=[];
  for(let i=0;i<fc;i++)out.push({id:"f"+i,name:NAMES[i],isGroup:false});
  for(let g=0;g<gc;g++)out.push({id:GROUPS[g].id,name:GROUPS[g].name,isGroup:true});
  return out;
}
function hexLerp(a,b,t){
  const pa=[parseInt(a.slice(1,3),16),parseInt(a.slice(3,5),16),parseInt(a.slice(5,7),16)];
  const pb=[parseInt(b.slice(1,3),16),parseInt(b.slice(3,5),16),parseInt(b.slice(5,7),16)];
  const c=pa.map((v,i)=>Math.round(v+(pb[i]-v)*t));return "rgb("+c[0]+","+c[1]+","+c[2]+")";
}
function recipColor(r){return r<0.5?hexLerp("#4ECDC4","#FFF1C0",r/0.5):hexLerp("#FFF1C0","#FF6B6B",(r-0.5)/0.5);}
function reciprocity(m){const s=4+hash(m.id,11)%260,rc=4+hash(m.id,23)%260;return s/(s+rc);}
function volume(m){return (4+hash(m.id,11)%260)+(4+hash(m.id,23)%260);}
function recency(m){return hash(m.id,41)%110;}
function initials(n){const p=n.split(" ");return p.length>1?(p[0][0]+p[1][0]):n.slice(0,2);}
function glyph(m){return m.isGroup?m.name.split(" ").map(w=>w[0]).join("").slice(0,2):initials(m.name);}
function avatarBg(m){if(m.isGroup)return "linear-gradient(135deg,#5fe9dc,#2bb6a8)";
  const hu=hash(m.name,1)%360,hu2=(hu+38)%360;return "linear-gradient(140deg,hsl("+hu+",58%,62%),hsl("+hu2+",56%,48%))";}

/* ---- small DOM builder (no innerHTML) ---- */
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}

const S={lab:"innerSky",popIndex:2,names:true,launched:false,skyMode:"gravity",skyZoom:1,
  pinned:[],released:new Set(),query:"",drawerOpen:false,order:null,focus:0,focusTarget:0};
let RAF=null;
const stage=document.getElementById("stage"), topbar=document.getElementById("topbar"), legend=document.getElementById("legend");
function members(){return buildPop(POPS[S.popIndex]);}
function toast(msg){let t=stage.querySelector(".toast");if(!t){t=el("div","toast");stage.appendChild(t);}
  t.textContent=msg;requestAnimationFrame(()=>t.classList.add("show"));clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1600);}
function closePop(){const p=stage.querySelector(".pop");if(p)p.remove();}

/* ---- top bar ---- */
function chip(text,on,fn){const c=el("div","chip"+(on?" on":""),text);c.onclick=fn;return c;}
function renderTopBar(){
  topbar.replaceChildren();
  topbar.appendChild(el("div","brand","Orbit3"));
  const labText={classic:"Classic",innerSky:"Inner+Sky",fisheye:"Fisheye"}[S.lab];
  topbar.appendChild(chip("🧪 "+labText,S.lab!=="classic",cycleLab));
  topbar.appendChild(chip("👥 "+POPS[S.popIndex],false,()=>{S.popIndex=(S.popIndex+1)%POPS.length;resetForPop();render();}));
  topbar.appendChild(chip("🏷 names",S.names,()=>{S.names=!S.names;render();}));
  topbar.appendChild(el("div","badge","PROTOTYPE · VISUALS"));
}
function cycleLab(){const o=["classic","innerSky","fisheye"];S.lab=o[(o.indexOf(S.lab)+1)%o.length];syncSwitcher();resetForPop();render();}
function syncSwitcher(){document.querySelectorAll("#switcher button").forEach(b=>b.classList.toggle("on",b.dataset.lab===S.lab));}
function resetForPop(){S.launched=false;S.drawerOpen=false;S.query="";S.focus=0;S.focusTarget=0;S.order=null;}

/* ---- avatar element ---- */
function avatarEl(m,size,opts){
  opts=opts||{};
  const a=el("div","av"+(opts.you?" you":"")+(opts.match?" match":""));
  a.style.width=size+"px";a.style.height=size+"px";a.style.left=opts.x+"px";a.style.top=opts.y+"px";
  a.style.fontSize=Math.max(8,size*0.34)+"px";
  if(opts.opacity!=null)a.style.opacity=opts.opacity;
  const face=el("div","face");
  face.style.background=opts.you?"radial-gradient(circle at 35% 30%,#5dffa0,#13a44b)":avatarBg(m);
  if(!opts.you){a.style.boxShadow="0 0 0 2.4px "+recipColor(reciprocity(m))+(opts.match?",0 0 26px 4px rgba(30,215,96,.8)":"");}
  if(size>=15)face.textContent=opts.you?"YOU":glyph(m);
  a.appendChild(face);
  if(opts.label)a.appendChild(el("div","lbl",m.name));
  if(opts.onClick)a.onclick=(e)=>{e.stopPropagation();opts.onClick(a,m);};
  return a;
}

/* ---- ring math (computeOrbit3RingLayout) ---- */
const RING_CAP=k=>5+3*k, RING_R=k=>62+46*k, RING_AV=k=>k===0?38:(k===1?30:26);
function fillRings(count){const f=[];let rem=count,k=0;while(rem>0){const c=Math.min(RING_CAP(k),rem);f.push(c);rem-=c;k++;}if(!f.length)f.push(0);return f;}
const INNER_CAP=RING_CAP(0)+RING_CAP(1)+RING_CAP(2); /* 24 */

function render(){
  cancelAnimationFrame(RAF);RAF=null;closePop();renderTopBar();stage.replaceChildren();
  if(S.lab==="classic")renderClassic();
  else if(S.lab==="fisheye")renderFisheye();
  else{if(S.launched)renderSky();else renderInner();renderDrawer();}
  renderLegend();
}
function sz(){return {w:stage.clientWidth,h:stage.clientHeight};}
function drawRing(cx,cy,R,op){const r=el("div","ring");r.style.left=cx+"px";r.style.top=cy+"px";
  r.style.width=(R*2)+"px";r.style.height=(R*2)+"px";if(op!=null)r.style.borderColor="rgba(129,230,217,"+op+")";stage.appendChild(r);}
function tierLabel(text){const t=el("div","tierlabel");t.appendChild(el("span",null,text));stage.appendChild(t);}

function orderedA(){
  const ms=members(),byId=Object.fromEntries(ms.map(m=>[m.id,m]));
  const pinned=S.pinned.filter(id=>byId[id]).map(id=>byId[id]);
  const ps=new Set(S.pinned);
  const auto=ms.filter(m=>!ps.has(m.id)&&!S.released.has(m.id));
  const rel=ms.filter(m=>S.released.has(m.id)&&!ps.has(m.id));
  return [...pinned,...auto,...rel];
}

/* ---- CLASSIC (today) ---- */
function renderClassic(){
  const ms=members(),{w,h}=sz();
  const fills=fillRings(ms.length);
  const outerR=RING_R(fills.length-1)+RING_AV(fills.length-1)/2+10, box=2*outerR;
  const scale=Math.min(1,(Math.min(w,h-20)-16)/box), cx=w/2, cy=(h-20)/2;
  for(let k=0;k<fills.length;k++)drawRing(cx,cy,RING_R(k)*scale);
  stage.appendChild(avatarEl({id:"me",name:"You"},48*scale,{you:true,x:cx,y:cy}));
  let idx=0;
  for(let k=0;k<fills.length;k++){const m=fills[k],R=RING_R(k)*scale,av=RING_AV(k)*scale;
    for(let i=0;i<m;i++){const ang=(i*360/m+k*15-90)*Math.PI/180;
      stage.appendChild(avatarEl(ms[idx],av,{x:cx+Math.cos(ang)*R,y:cy+Math.sin(ang)*R,label:S.names&&scale>0.82,onClick:openChat}));idx++;}}
  tierLabel(scale<0.95?("Scaled to "+Math.round(scale*100)+"% — avatars shrink, rings pile up past ~25"):"Fits fine at this size");
}

/* ---- A · INNER ORBIT (capped 3 rings, never shrinks) ---- */
function renderInner(){
  const {w,h}=sz(), ordered=orderedA();
  const fills=fillRings(ordered.length).slice(0,3);
  const shown=fills.reduce((a,b)=>a+b,0), hidden=ordered.length-shown;
  const cx=w/2, cy=(h-90)/2+6;
  for(let k=0;k<fills.length;k++)drawRing(cx,cy,RING_R(k));
  stage.appendChild(avatarEl({id:"me",name:"You"},48,{you:true,x:cx,y:cy}));
  if(S.names){const yl=el("div","floatlbl","You");yl.style.left=cx+"px";yl.style.top=(cy+30)+"px";stage.appendChild(yl);}
  let idx=0; const outer=fills.length-1, hasNode=hidden>0;
  for(let k=0;k<fills.length;k++){const m=fills[k],R=RING_R(k),av=RING_AV(k),slots=(k===outer&&hasNode)?m+1:m;
    for(let i=0;i<m;i++){const ang=(i*360/slots+k*15-90)*Math.PI/180;
      stage.appendChild(avatarEl(ordered[idx],av,{x:cx+Math.cos(ang)*R,y:cy+Math.sin(ang)*R,label:S.names,onClick:innerMenu}));idx++;}}
  if(hasNode){const m=fills[outer],ang=(m*360/(m+1)+outer*15-90)*Math.PI/180;
    const node=el("div","node","+"+hidden);node.style.left=(cx+Math.cos(ang)*RING_R(outer))+"px";node.style.top=(cy+Math.sin(ang)*RING_R(outer))+"px";
    node.onclick=()=>{S.launched=true;render();};stage.appendChild(node);
    tierLabel("Tap +"+hidden+" to launch into the Sky · tap a member to pin / release");
  } else tierLabel("Everyone fits — your whole circle is legible at full size");
}
function innerMenu(a,m){
  if(m.isGroup){openChat(a,m);return;}
  popover(a,m,[{t:"💬 Message",fn:()=>toast("Opening chat with "+m.name)},
    {t:"↧ Release to drawer",warn:true,fn:()=>{S.pinned=S.pinned.filter(x=>x!==m.id);S.released.add(m.id);toast(m.name+" released to the drawer");render();}}]);
}

/* ---- A · SKY (constellation) ---- */
function renderSky(){
  const {w,h}=sz(), ms=members(), n=ms.length, cx=w/2, cy=(h-70)/2+10, z=S.skyZoom;
  const maxR=Math.min(w,h-90)/2-26;
  const row=el("div","floatrow");
  row.appendChild(mkPill("‹ Inner",false,()=>{S.launched=false;render();}));
  row.appendChild(mkPill({gravity:"🪐 Gravity",galaxy:"✨ Galaxy"}[S.skyMode],true,()=>{S.skyMode=S.skyMode==="gravity"?"galaxy":"gravity";render();}));
  row.appendChild(el("div","hint","Whole network · zoom to fly in"));
  stage.appendChild(row);
  const rl=el("div","recip");rl.appendChild(el("div","bar"));const ends=el("div","ends");
  ends.appendChild(el("span",null,"listens"));ends.appendChild(el("span",null,"talks"));rl.appendChild(ends);stage.appendChild(rl);
  const zc=el("div","zoomers");const zin=el("button",null,"+");zin.onclick=()=>{S.skyZoom=Math.min(3.2,S.skyZoom+0.5);render();};
  const zout=el("button",null,"−");zout.onclick=()=>{S.skyZoom=Math.max(1,S.skyZoom-0.5);render();};
  zc.appendChild(zin);zc.appendChild(zout);stage.appendChild(zc);
  stage.appendChild(avatarEl({id:"me",name:"You"},Math.min(34,20+z*6),{you:true,x:cx,y:cy}));
  const maxVol=Math.max(...ms.map(volume));
  ms.forEach((m,i)=>{
    const mag=Math.log(1+volume(m))/Math.log(1+maxVol);
    const rec=1-Math.min(recency(m),90)/90, closeness=0.6*mag+0.4*rec, orderT=n<=1?0:i/(n-1);
    let R,ang;
    if(S.skyMode==="gravity"){R=maxR*(0.18+(1-closeness)*0.82);ang=h01(m.id,5)*2*Math.PI;}
    else{ang=orderT*2.2*2*Math.PI+(reciprocity(m)-0.5)*0.5;R=maxR*(0.12+orderT*0.88);}
    R=Math.min(R*z,maxR*z);
    const x=cx+Math.cos(ang)*R, y=cy+Math.sin(ang)*R, showFace=z>=2, size=showFace?(16+10*mag):(5+9*mag);
    const a=avatarEl(m,size,{x,y,label:(z>=1.8&&i<14),onClick:openChat});
    if(!showFace){const f=a.querySelector(".face");f.textContent="";f.style.background=recipColor(reciprocity(m));a.style.boxShadow="0 0 "+(6+12*mag)+"px "+recipColor(reciprocity(m));}
    a.style.opacity=0.55+0.45*mag;stage.appendChild(a);
  });
}

/* ---- A · DRAWER ---- */
function renderDrawer(){
  const ordered=orderedA(), overflow=ordered.length-INNER_CAP;
  const d=el("div","drawer");d.style.height=S.drawerOpen?"74%":"96px";
  const grab=el("div","grab");grab.onclick=toggleDrawer;d.appendChild(grab);
  const head=el("div","dhead");
  head.appendChild(el("span",null,"👤"));head.appendChild(el("b",null,"All friends"));
  head.appendChild(el("span","cnt","· +"+Math.max(0,overflow)));
  head.appendChild(el("span","dh","tap handle to "+(S.drawerOpen?"close":"search")));
  head.onclick=toggleDrawer;d.appendChild(head);
  if(S.drawerOpen){
    const sb=el("div","search");sb.appendChild(el("span",null,"🔍"));
    const inp=el("input");inp.placeholder="Find anyone";inp.value=S.query;
    inp.oninput=()=>{S.query=inp.value;const list=d.querySelector(".list");if(list)fillList(list,overflow);};
    sb.appendChild(inp);d.appendChild(sb);
    const list=el("div","list");d.appendChild(list);fillList(list,overflow);
    setTimeout(()=>inp.focus(),60);
  }
  stage.appendChild(d);
}
function toggleDrawer(){S.drawerOpen=!S.drawerOpen;render();}
function fillList(list,overflow){
  const tail=orderedA().slice(INNER_CAP), q=S.query.trim().toLowerCase();
  const items=q?tail.filter(m=>m.name.toLowerCase().includes(q)):tail;
  list.replaceChildren();
  if(!items.length){list.appendChild(el("div","empty",overflow<=0?"Everyone fits in your Inner Orbit":"No matches"));return;}
  items.forEach(m=>{
    const row=el("div","drow");
    const da=el("div","da",glyph(m));da.style.background=avatarBg(m);da.style.boxShadow="0 0 0 2px "+recipColor(reciprocity(m));
    const meta=el("div","meta");meta.appendChild(el("div","nm",m.name));meta.appendChild(el("div","pv",PREVIEWS[hash(m.id,3)%PREVIEWS.length]));
    const pin=el("div","pinbtn","⭐ Pin");
    pin.onclick=(e)=>{e.stopPropagation();S.released.delete(m.id);S.pinned=[m.id,...S.pinned.filter(x=>x!==m.id)];toast(m.name+" pinned to your Inner Orbit");render();};
    row.appendChild(da);row.appendChild(meta);row.appendChild(pin);
    row.onclick=()=>toast("Opening chat with "+m.name);list.appendChild(row);
  });
}

/* ---- B · FISHEYE / ORBIT-CLIMB ---- */
function ringsOf(ordered){const r=[];let i=0,k=0;while(i<ordered.length){r.push(ordered.slice(i,i+RING_CAP(k)));i+=RING_CAP(k);k++;}return r;}
const tanh=x=>{const e=Math.exp(2*x);return (e-1)/(e+1);};
const FR=132,AMP=122,SPREAD=1.25;
const screenR=d=>FR+AMP*tanh(d/SPREAD), weight=d=>1/(1+(d/0.85)*(d/0.85));
function renderFisheye(){if(!S.order)S.order=members().map(m=>m.id);drawFisheye();}
function drawFisheye(){
  const {w,h}=sz(), ms=members(), byId=Object.fromEntries(ms.map(m=>[m.id,m]));
  const ordered=S.order.map(id=>byId[id]).filter(Boolean), rings=ringsOf(ordered), cx=w/2, cy=(h-30)/2;
  stage.replaceChildren();
  for(let k=0;k<rings.length;k++){const R=screenR(k-S.focus);if(R>2)drawRing(cx,cy,R,0.08+0.3*weight(k-S.focus));}
  stage.appendChild(avatarEl({id:"me",name:"You"},52,{you:true,x:cx,y:cy}));
  const drawOrder=rings.map((_,k)=>k).sort((a,b)=>weight(b-S.focus)-weight(a-S.focus));
  drawOrder.forEach(k=>{
    const dist=k-S.focus,R=screenR(dist),wgt=weight(dist),size=9+(38-9)*wgt,op=Math.max(0.2,0.2+0.8*wgt),showName=wgt>0.55&&S.names,mm=rings[k];
    mm.forEach((m,i)=>{const ang=(i*360/mm.length+k*14-90)*Math.PI/180;
      const a=avatarEl(m,size,{x:cx+Math.cos(ang)*R,y:cy+Math.sin(ang)*R,label:showName,opacity:op,onClick:(e2,mem)=>fisheyeTap(e2,mem,k)});
      if(size<15)a.querySelector(".face").textContent="";stage.appendChild(a);});
  });
  const rail=el("div","rail");
  for(let k=0;k<rings.length;k++){const t=el("div","t"+(Math.abs(k-S.focus)<0.5?" on":""));t.onclick=()=>{S.focusTarget=k;animateFocus();};rail.appendChild(t);}
  stage.appendChild(rail);
  const fi=Math.max(0,Math.min(rings.length-1,Math.round(S.focus))), cnt=rings[fi]?rings[fi].length:0;
  tierLabel("Tier "+(fi+1)+" · "+cnt+" people · drag ↕ to travel · tap a faint one to focus");
}
function fisheyeTap(a,m,k){
  if(Math.abs(k-S.focus)>=0.5){S.focusTarget=k;animateFocus();return;}
  popover(a,m,[{t:"💬 Message",fn:()=>toast("Opening chat with "+m.name)},
    {t:"⤓ Pull into inner tier",fn:()=>{S.order=[m.id,...S.order.filter(x=>x!==m.id)];S.focusTarget=0;animateFocus();toast(m.name+" pulled into your inner tier");}}]);
}
function animateFocus(){cancelAnimationFrame(RAF);const step=()=>{const d=S.focusTarget-S.focus;
  if(Math.abs(d)<0.01){S.focus=S.focusTarget;drawFisheye();RAF=null;return;}S.focus+=d*0.22;drawFisheye();RAF=requestAnimationFrame(step);};step();}

/* ---- drag / wheel ---- */
let dragY=null;
stage.addEventListener("pointerdown",e=>{if(S.lab==="fisheye"){dragY=e.clientY;try{stage.setPointerCapture(e.pointerId);}catch(x){}}closePop();});
stage.addEventListener("pointermove",e=>{if(S.lab==="fisheye"&&dragY!=null){const dy=e.clientY-dragY;dragY=e.clientY;
  const max=ringsOf(members()).length-1;S.focus=Math.max(0,Math.min(max,S.focus-dy/92));S.focusTarget=S.focus;drawFisheye();}});
stage.addEventListener("pointerup",()=>{if(dragY!=null){dragY=null;S.focusTarget=Math.round(S.focus);animateFocus();}});
stage.addEventListener("wheel",e=>{
  if(S.lab==="fisheye"){e.preventDefault();const max=ringsOf(members()).length-1;S.focusTarget=Math.max(0,Math.min(max,S.focusTarget+(e.deltaY>0?0.6:-0.6)));animateFocus();}
  else if(S.lab==="innerSky"&&S.launched){e.preventDefault();S.skyZoom=Math.max(1,Math.min(3.2,S.skyZoom+(e.deltaY>0?-0.4:0.4)));render();}
},{passive:false});

/* ---- shared ---- */
function openChat(a,m){toast("Opening chat with "+m.name);}
function mkPill(text,on,fn){const p=el("div","pill"+(on?" on":""),text);p.onclick=fn;return p;}
function popover(anchor,m,actions){
  closePop();const p=el("div","pop");p.appendChild(el("div","nmh",m.name));
  actions.forEach(act=>{const b=el("button",act.warn?"warn":null,act.t);b.onclick=()=>{closePop();act.fn();};p.appendChild(b);});
  stage.appendChild(p);
  const ar=anchor.getBoundingClientRect(),sr=stage.getBoundingClientRect();
  let left=ar.left-sr.left+ar.width/2-75, top=ar.top-sr.top+ar.height/2+18;
  left=Math.max(8,Math.min(stage.clientWidth-158,left));top=Math.min(stage.clientHeight-120,top);
  p.style.left=left+"px";p.style.top=top+"px";
}
function renderLegend(){
  const map={
    classic:"Classic (today) — the shipped One Circle. Cycle 👥 to 50 and watch every avatar shrink as rings pile up. This is the problem we're fixing.",
    innerSky:"Inner + Sky + Drawer — orbit hard-capped to 3 rings (never shrinks). Tap +N to launch into the Sky (switch Gravity / Galaxy; + − or scroll-wheel to zoom in). Tap the bottom handle to open the drawer and ⭐ Pin someone in; tap a seated avatar to release them.",
    fisheye:"Fisheye / Orbit-Climb — one orbit holds everyone; only the focused tier blooms. Drag ↕ (or scroll-wheel) to climb outward, tap the rail dots on the right, tap a faint member to focus its tier, tap a focused member to pull them into your inner tier."
  };
  legend.textContent=map[S.lab];
}
document.querySelectorAll("#switcher button").forEach(b=>{b.onclick=()=>{S.lab=b.dataset.lab;syncSwitcher();resetForPop();render();};});
document.addEventListener("click",e=>{if(!e.target.closest(".pop")&&!e.target.closest(".av")&&!e.target.closest(".node"))closePop();});
render();
</script>
