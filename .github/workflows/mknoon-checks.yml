name: Mknoon checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [change, release, full]
        default: change
      baseline:
        description: Explicit comparison SHA; release requires actual published SHA
        required: true
      build_label:
        description: Intended candidate version (not artifact proof)
        default: ''
  schedule:
    - cron: '23 2 * * 0'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan_sha256: ${{ steps.plan.outputs.plan_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate rules and workflow contracts
        run: |
          python3 scripts/mknoon_checks.py validate
          python3 -m unittest discover -s scripts/test -p '*checks_test.py'
          python3 -m unittest discover -s scripts/test -p 'testing_inventory_test.py'
      - name: Bind the expected candidate and selection
        id: plan
        run: python3 scripts/mknoon_checks.py ci-plan --output .codex-test-logs/ci-expected
      - name: Preserve the independent expected plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expected-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .codex-test-logs/ci-expected/plan.json
            .codex-test-logs/ci-expected/error.json
          include-hidden-files: true
          if-no-files-found: error

  selected:
    needs: metadata
    # Provision a disposable runner with Flutter/Go/native toolchains and isolated
    # fixtures first. Fork code must never run on a credentialed device host.
    if: vars.MKNOON_TEST_RUNNER_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, mknoon-test]
    timeout-minutes: ${{ (github.event_name == 'schedule' || inputs.mode == 'full') && 4320 || 360 }}
    concurrency:
      group: mknoon-shared-test-devices
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: expected-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-test-logs/ci-expected
      - name: Run the same local selector
        env:
          MKNOON_PLAN_SHA256: ${{ needs.metadata.outputs.plan_sha256 }}
          DEVICE_CONFIG: ${{ vars.MKNOON_TEST_DEVICE_CONFIG }}
          CANDIDATE_ARTIFACT: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && vars.MKNOON_CANDIDATE_ARTIFACT || '' }}
          MANUAL_EVIDENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && vars.MKNOON_MANUAL_EVIDENCE || '' }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$DEVICE_CONFIG" ]]; then args+=(--device-config "$DEVICE_CONFIG"); fi
          if [[ -n "$CANDIDATE_ARTIFACT" ]]; then args+=(--candidate-artifact "$CANDIDATE_ARTIFACT"); fi
          if [[ -n "$MANUAL_EVIDENCE" ]]; then args+=(--evidence "$MANUAL_EVIDENCE"); fi
          flutter pub get
          python3 scripts/mknoon_checks.py validate
          python3 scripts/mknoon_checks.py ci-run --expected-plan .codex-test-logs/ci-expected/plan.json --output .codex-test-logs/ci-run "${args[@]}"
      - name: Preserve first attempts and incomplete full runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .codex-test-logs/ci-run/plan.json
            .codex-test-logs/ci-run/results.json
            .codex-test-logs/ci-run/partial.json
            .codex-test-logs/ci-run/summary.txt
            .codex-test-logs/ci-run/error.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  required:
    # Only PR runs emit the required context. A scheduled/release/manual check
    # of the same SHA must never substitute for the PR's comparison plan.
    name: ${{ github.event_name == 'pull_request' && 'Mknoon regression checks' || (github.event_name == 'schedule' || inputs.mode == 'full') && 'Mknoon full regression' || inputs.mode == 'release' && 'Mknoon signed-release acceptance' || 'Mknoon change diagnostics' }}
    needs: [metadata, selected]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: always() && needs.metadata.result == 'success'
        with:
          name: expected-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-test-logs/ci-expected
      - uses: actions/download-artifact@v4
        if: always() && needs.selected.result != 'skipped'
        with:
          name: checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: .codex-test-logs/ci-run
      - name: Require complete results from this candidate and plan
        if: always()
        env:
          MKNOON_METADATA_RESULT: ${{ needs.metadata.result }}
          MKNOON_EXECUTION_RESULT: ${{ needs.selected.result }}
          MKNOON_PLAN_SHA256: ${{ needs.metadata.outputs.plan_sha256 }}
        run: python3 scripts/mknoon_checks.py ci-verify --expected-plan .codex-test-logs/ci-expected/plan.json --report-directory .codex-test-logs/ci-run --output .codex-test-logs/ci-verdict
