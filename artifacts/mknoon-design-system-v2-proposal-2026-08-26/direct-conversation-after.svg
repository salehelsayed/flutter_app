<svg xmlns="http://www.w3.org/2000/svg" width="430" height="956" viewBox="0 0 430 956">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090A10"/>
      <stop offset="0.55" stop-color="#0D0F17"/>
      <stop offset="1" stop-color="#10121B"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="35%" r="60%">
      <stop offset="0" stop-color="#6045B6" stop-opacity=".16"/>
      <stop offset=".45" stop-color="#4ECDC4" stop-opacity=".05"/>
      <stop offset="1" stop-color="#090A10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="avatar" cx="45%" cy="42%" r="58%">
      <stop offset="0" stop-color="#B99CFF"/>
      <stop offset=".35" stop-color="#7455D4"/>
      <stop offset="1" stop-color="#2A2144"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity=".35"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="430" height="956" fill="url(#bg)"/>
  <rect width="430" height="956" fill="url(#ambient)"/>

  <!-- status bar -->
  <text x="24" y="31" fill="#F4F3F8" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="14" font-weight="650">9:41</text>
  <g fill="#F4F3F8">
    <rect x="353" y="21" width="3" height="7" rx="1"/><rect x="358" y="18" width="3" height="10" rx="1"/><rect x="363" y="15" width="3" height="13" rx="1"/>
    <path d="M374 20q7-7 14 0l-2 2q-5-5-10 0zm3 4q4-4 8 0l-4 4z"/>
    <rect x="397" y="17" width="22" height="11" rx="3" fill="none" stroke="#F4F3F8" stroke-width="1.5"/><rect x="419" y="20" width="2" height="5" rx="1"/><rect x="399" y="19" width="16" height="7" rx="1.5"/>
  </g>

  <!-- layered header -->
  <rect x="0" y="44" width="430" height="82" fill="#11131B" fill-opacity=".92"/>
  <line x1="0" y1="125.5" x2="430" y2="125.5" stroke="#FFFFFF" stroke-opacity=".055"/>
  <circle cx="30" cy="84" r="19" fill="#191C26"/>
  <path d="M34 76l-8 8 8 8" fill="none" stroke="#D8D6E0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="74" cy="84" r="27" fill="#6B4DC8" opacity=".13" filter="url(#glow)"/>
  <circle cx="74" cy="84" r="22" fill="#11131B" stroke="#39C67A" stroke-width="2.2" stroke-dasharray="7 4"/>
  <circle cx="74" cy="84" r="15" fill="url(#avatar)" stroke="#D6C8FF" stroke-opacity=".42" stroke-width="2"/>
  <circle cx="74" cy="84" r="5" fill="#B99CFF"/>
  <text x="110" y="79" fill="#F4F3F8" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="17" font-weight="700">Maya</text>
  <circle cx="114" cy="99" r="3" fill="#39C67A"/>
  <text x="122" y="103" fill="#A4A1AF" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="12.5" font-weight="500">Connected · Jul 9</text>
  <circle cx="398" cy="84" r="19" fill="#191C26"/>
  <circle cx="398" cy="77" r="1.7" fill="#C5C2CE"/><circle cx="398" cy="84" r="1.7" fill="#C5C2CE"/><circle cx="398" cy="91" r="1.7" fill="#C5C2CE"/>

  <!-- compact intro banner -->
  <g filter="url(#shadow)">
    <rect x="16" y="142" width="398" height="78" rx="18" fill="#151923"/>
    <rect x="16.5" y="142.5" width="397" height="77" rx="17.5" fill="none" stroke="#39C67A" stroke-opacity=".24"/>
  </g>
  <circle cx="45" cy="171" r="15" fill="#39C67A" fill-opacity=".13"/>
  <path d="M39 173q6-10 12 0M45 164v13" fill="none" stroke="#55D88C" stroke-width="1.7" stroke-linecap="round"/>
  <text x="70" y="167" fill="#E7E5EC" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="14" font-weight="650">Help Maya meet your circle</text>
  <text x="70" y="188" fill="#918E9D" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="12.5">Introduce someone who might click.</text>
  <rect x="300" y="162" width="96" height="38" rx="12" fill="#1E4934"/>
  <text x="348" y="186" text-anchor="middle" fill="#A9F0C4" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="12" font-weight="700">Introduce</text>

  <!-- date divider -->
  <line x1="24" y1="250" x2="172" y2="250" stroke="#FFFFFF" stroke-opacity=".07"/>
  <rect x="180" y="236" width="70" height="28" rx="14" fill="#141720"/>
  <text x="215" y="254" text-anchor="middle" fill="#777483" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="11" font-weight="650">TODAY</text>
  <line x1="258" y1="250" x2="406" y2="250" stroke="#FFFFFF" stroke-opacity=".07"/>

  <!-- incoming run -->
  <rect x="18" y="286" width="270" height="58" rx="18" fill="#191C26"/>
  <text x="34" y="311" fill="#F0EEF4" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="15">Did you see the night sky?</text>
  <text x="248" y="331" fill="#7F7C89" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="10.5">9:37 PM</text>
  <rect x="18" y="348" width="204" height="58" rx="18" ry="18" fill="#191C26"/>
  <path d="M18 348h18v12H18z" fill="#191C26"/>
  <text x="34" y="374" fill="#F0EEF4" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="15">It’s unreal tonight.</text>
  <text x="182" y="393" fill="#7F7C89" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="10.5">9:38 PM</text>

  <!-- media message -->
  <rect x="18" y="418" width="282" height="190" rx="20" fill="#191C26"/>
  <rect x="24" y="424" width="270" height="144" rx="15" fill="#242334"/>
  <circle cx="230" cy="470" r="52" fill="#6045B6" opacity=".16" filter="url(#glow)"/>
  <path d="M24 540L92 476l52 44 44-38 106 86H24z" fill="#3D3854"/>
  <circle cx="233" cy="458" r="18" fill="#D6C8FF" fill-opacity=".75"/>
  <circle cx="233" cy="458" r="6" fill="#A789FF"/>
  <text x="36" y="590" fill="#E9E7EE" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="14">Right above the rooftops ✨</text>
  <text x="260" y="590" fill="#85818F" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="10.5">9:40 PM</text>

  <!-- outgoing run -->
  <rect x="132" y="632" width="280" height="64" rx="18" fill="#30294A"/>
  <rect x="411" y="632" width="1" height="64" fill="#8D72DE"/>
  <text x="149" y="658" fill="#F6F3FA" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="15">That color is pure Mknoon.</text>
  <text x="343" y="683" fill="#AAA1C2" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="10.5">9:41 PM</text>
  <path d="M389 676l4 4 8-9M394 676l4 4 8-9" fill="none" stroke="#67DDD3" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="318" y="687" width="50" height="30" rx="15" fill="#1F2230" stroke="#FFFFFF" stroke-opacity=".06"/>
  <text x="343" y="707" text-anchor="middle" fill="#E7E3EE" font-family="Apple Color Emoji,-apple-system,Arial" font-size="14">✨ 2</text>

  <!-- composer dock -->
  <rect x="0" y="788" width="430" height="168" fill="#0A0B11" fill-opacity=".62"/>
  <line x1="0" y1="788" x2="430" y2="788" stroke="#FFFFFF" stroke-opacity=".05"/>
  <g filter="url(#shadow)">
    <rect x="12" y="804" width="406" height="72" rx="24" fill="#151820"/>
  </g>
  <circle cx="44" cy="840" r="20" fill="#202431"/>
  <path d="M44 833v14M37 840h14" stroke="#B8B5C1" stroke-width="2" stroke-linecap="round"/>
  <text x="78" y="846" fill="#777483" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="15">Write a message…</text>
  <circle cx="384" cy="840" r="24" fill="#6045B6"/>
  <path d="M379 832v8a5 5 0 0010 0v-8M376 840a8 8 0 0016 0M384 848v5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="24" y="897" fill="#5E5B68" font-family="-apple-system,BlinkMacSystemFont,Arial" font-size="11.5">Encrypted end-to-end</text>
  <rect x="151" y="930" width="128" height="5" rx="3" fill="#F4F3F8" fill-opacity=".65"/>
</svg>
