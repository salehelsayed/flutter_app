  <rect x="151" y="240" width="261" height="60" rx="18" fill="#30294A" opacity=".67"/><text x="168" y="269" fill="#DBD7E1" font-family="-apple-system,Arial" font-size="15">Yes — adding one note.</text><text x="361" y="287" fill="#9188A6" font-family="-apple-system,Arial" font-size="10.5">9:39 PM</text>
  <rect x="18" y="320" width="219" height="60" rx="18" fill="#191C26" opacity=".62"/><text x="34" y="349" fill="#C4C1CB" font-family="-apple-system,Arial" font-size="15">Perfect, thank you.</text><text x="192" y="367" fill="#706D78" font-family="-apple-system,Arial" font-size="10.5">9:40 PM</text>
