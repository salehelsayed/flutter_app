<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="760" viewBox="0 0 1290 760">
  <defs><linearGradient id="ccbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070A0F"/><stop offset="1" stop-color="#0B1420"/></linearGradient><pattern id="ccstars" width="88" height="76" patternUnits="userSpaceOnUse"><circle cx="12" cy="17" r=".7" fill="#DDEFFF" opacity=".15"/><circle cx="66" cy="55" r=".5" fill="#DDEFFF" opacity=".08"/></pattern></defs>
  <rect width="1290" height="760" fill="#E9EDF0"/>
  <g><rect width="430" height="760" fill="#090A10"/><text x="16" y="27" fill="#FFF" font-family="-apple-system,Arial" font-size="12" font-weight="800">ALTERNATIVE A · VIOLET OWNERSHIP</text><text x="16" y="46" fill="#9E99A8" font-family="-apple-system,Arial" font-size="10.5">Clear, fashionable, but too close to generic dark social apps</text><rect y="62" width="430" height="72" fill="#11131B"/><text x="70" y="104" fill="#FFF" font-family="-apple-system,Arial" font-size="17" font-weight="700">Maya</text><rect x="18" y="176" width="282" height="74" rx="18" fill="#191C26"/><text x="34" y="204" fill="#FFF" font-family="-apple-system,Arial" font-size="14.5">The hierarchy is definitely cleaner.</text><text x="34" y="227" fill="#FFF" font-family="-apple-system,Arial" font-size="14.5">But does it still feel like Mknoon?</text><text x="260" y="240" fill="#777483" font-family="-apple-system,Arial" font-size="10.5">9:32</text><rect x="118" y="270" width="294" height="72" rx="18" fill="#30294A"/><text x="134" y="298" fill="#FFF" font-family="-apple-system,Arial" font-size="14.5">The violet is doing too much of the</text><text x="134" y="320" fill="#FFF" font-family="-apple-system,Arial" font-size="14.5">brand work by itself.</text><text x="370" y="332" fill="#AAA1C2" font-family="-apple-system,Arial" font-size="10.5">9:33</text><rect x="18" y="365" width="248" height="56" rx="18" fill="#191C26"/><text x="34" y="397" fill="#FFF" font-family="-apple-system,Arial" font-size="14.5">Exactly. It feels imported.</text><rect x="12" y="655" width="406" height="58" rx="22" fill="#151820"/><circle cx="383" cy="684" r="21" fill="#6045B6"/></g>
  <g transform="translate(430 0)"><rect width="430" height="760" fill="#0B0E13"/><text x="16" y="27" fill="#FFF" font-family="-apple-system,Arial" font-size="12" font-weight="800">ALTERNATIVE B · PURE NEUTRAL</text><text x="16" y="46" fill="#9BA4AB" font-family="-apple-system,Arial" font-size="10.5">Calm and readable, but anonymous if orbit avatars disappear</text><rect y="62" width="430" height="72" fill="#11161D"/><text x="70" y="104" fill="#FFF" font-family="-apple-system,Arial" font-size="17" font-weight="700">Maya</text><rect x="18" y="176" width="282" height="74" rx="15" fill="#161C24"/><text x="34" y="204" fill="#FFF" font-family="-apple-system,Arial" font-size="14.5">The hierarchy is definitely cleaner.</text><text x="34" y="227" fill="#FFF" font-family="-apple-system,Arial" font-size="14.5">But does it still feel like Mknoon?</text><text x="260" y="240" fill="#8E989F" font-family="-apple-system,Arial" font-size="10.5">9:32</text><rect x="118" y="270" width="294" height="72" rx="15" fill="#202731"/><text x="134" y="298" fill="#FFF" font-family="-apple-system,Arial" font-size="14.5">It is premium, but it could belong to</text><text x="134" y="320" fill="#FFF" font-family="-apple-system,Arial" font-size="14.5">almost any messaging product.</text><text x="370" y="332" fill="#9BA4AB" font-family="-apple-system,Arial" font-size="10.5">9:33</text><rect x="18" y="365" width="248" height="56" rx="15" fill="#161C24"/><text x="34" y="397" fill="#FFF" font-family="-apple-system,Arial" font-size="14.5">Too polished to be distinctive.</text><rect x="12" y="655" width="406" height="58" rx="19" fill="#161C24"/><circle cx="383" cy="684" r="20" fill="#267DA6"/></g>
  <g transform="translate(860 0)"><rect width="430" height="760" fill="url(#ccbg)"/><rect width="430" height="760" fill="url(#ccstars)"/><text x="16" y="27" fill="#FFF" font-family="-apple-system,Arial" font-size="12" font-weight="800">ALTERNATIVE C · ORBITAL SIGNATURES</text><text x="16" y="46" fill="#AEB8C0" font-family="-apple-system,Arial" font-size="10.5">Recommended: neutral reading field, relationship color at the edge</text><rect y="62" width="430" height="72" fill="#0C1118" fill-opacity=".94"/><circle cx="46" cy="98" r="20" fill="#0A0E14" stroke="#E64A65" stroke-width="2" stroke-dasharray="7 4"/><text x="78" y="103" fill="#FFF" font-family="-apple-system,Arial" font-size="17" font-weight="700">Maya</text><rect x="18" y="176" width="282" height="74" rx="15" fill="#151B23"/><rect x="18" y="176" width="2" height="74" rx="1" fill="#E64A65"/><text x="34" y="204" fill="#FFF" font-family="-apple-system,Arial" font-size="14.5">The hierarchy is definitely cleaner.</text><text x="34" y="227" fill="#FFF" font-family="-apple-system,Arial" font-size="14.5">And the edge still knows who I am.</text><text x="260" y="240" fill="#8A96A0" font-family="-apple-system,Arial" font-size="10.5">9:32</text><rect x="118" y="270" width="294" height="72" rx="15" fill="#1A222C"/><rect x="410" y="270" width="2" height="72" rx="1" fill="#7CC8F5"/><text x="134" y="298" fill="#FFF" font-family="-apple-system,Arial" font-size="14.5">Identity now comes from the orbit system,</text><text x="134" y="320" fill="#FFF" font-family="-apple-system,Arial" font-size="14.5">not from a fashionable fill color.</text><text x="370" y="332" fill="#8A96A0" font-family="-apple-system,Arial" font-size="10.5">9:33</text><rect x="18" y="365" width="248" height="56" rx="15" fill="#151B23"/><text x="34" y="397" fill="#FFF" font-family="-apple-system,Arial" font-size="14.5">Calm, but unmistakably ours.</text><rect x="12" y="655" width="406" height="58" rx="19" fill="#151B23"/><circle cx="383" cy="684" r="20" fill="none" stroke="#7CC8F5" stroke-width="1.5"/></g>
</svg>
