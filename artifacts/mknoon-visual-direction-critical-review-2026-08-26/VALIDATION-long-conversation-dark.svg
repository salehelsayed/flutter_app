<svg xmlns="http://www.w3.org/2000/svg" width="430" height="1000" viewBox="0 0 430 1000">
  <defs><linearGradient id="vlbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070A0F"/><stop offset="1" stop-color="#0B1420"/></linearGradient><pattern id="vlstars" width="94" height="82" patternUnits="userSpaceOnUse"><circle cx="11" cy="18" r=".65" fill="#DDEFFF" opacity=".12"/><circle cx="62" cy="51" r=".45" fill="#DDEFFF" opacity=".07"/></pattern></defs>
  <rect width="430" height="44" fill="#EEF2F5"/><text x="16" y="27" fill="#25323B" font-family="-apple-system,Arial" font-size="11" font-weight="750">PROPOSED MOCKUP · 42-MESSAGE STRESS SAMPLE</text>
  <g transform="translate(0 44)"><rect width="430" height="956" fill="url(#vlbg)"/><rect width="430" height="956" fill="url(#vlstars)"/><rect y="0" width="430" height="86" fill="#0C1118"/><path d="M30 34l-8 8 8 8" fill="none" stroke="#D5DDE2" stroke-width="2.2"/><circle cx="68" cy="42" r="21" fill="#16121B" stroke="#E64A65" stroke-width="2" stroke-dasharray="6 4"/><text x="102" y="39" fill="#FFF" font-family="-apple-system,Arial" font-size="16.5" font-weight="710">Maya</text><text x="102" y="60" fill="#AEB8C0" font-family="-apple-system,Arial" font-size="12">Connected</text>
    <g font-family="-apple-system,Arial"><rect x="18" y="106" width="86" height="44" rx="14" fill="#151B23"/><text x="32" y="133" fill="#FFF" font-size="14.5">Okay</text><text x="72" y="143" fill="#8A96A0" font-size="9.5">8:40</text>
      <rect x="156" y="158" width="256" height="44" rx="14" fill="#1A222C"/><text x="171" y="185" fill="#FFF" font-size="14.5">Sending the link now.</text><text x="370" y="195" fill="#8A96A0" font-size="9.5">8:41</text>
      <rect x="18" y="210" width="322" height="62" rx="14" fill="#151B23"/><text x="32" y="235" fill="#FFF" font-size="14.5">https://mknoon.app/review/final-direction</text><text x="32" y="256" fill="#9EDFFF" font-size="12.5">mknoon.app · Visual direction review</text><text x="302" y="264" fill="#8A96A0" font-size="9.5">8:42</text>
      <rect x="76" y="280" width="336" height="80" rx="14" fill="#1A222C"/><text x="91" y="306" fill="#FFF" font-size="14.5">I like the calmer surfaces. The relationship</text><text x="91" y="327" fill="#FFF" font-size="14.5">color at the edge is enough—please don’t</text><text x="91" y="348" fill="#FFF" font-size="14.5">turn the whole bubble purple again.</text><text x="371" y="351" fill="#8A96A0" font-size="9.5">8:43</text>
      <rect x="18" y="368" width="190" height="44" rx="14" fill="#151B23"/><text x="32" y="395" fill="#FFF" font-size="14.5">😂 fair point</text><text x="170" y="405" fill="#8A96A0" font-size="9.5">8:44</text>
      <rect x="160" y="420" width="252" height="62" rx="14" fill="#1A222C"/><text x="397" y="446" text-anchor="end" direction="rtl" unicode-bidi="bidi-override" fill="#FFF" font-size="14.5">الخلفية جميلة الآن</text><text x="397" y="467" text-anchor="end" direction="rtl" unicode-bidi="bidi-override" fill="#FFF" font-size="14.5">لكن النجوم يجب أن تبقى هادئة.</text><text x="370" y="474" fill="#8A96A0" font-size="9.5">8:45</text>
      <rect x="18" y="490" width="270" height="44" rx="14" fill="#151B23"/><text x="32" y="517" fill="#FFF" font-size="14.5">Agreed. They’re atmosphere, not content.</text><text x="250" y="527" fill="#8A96A0" font-size="9.5">8:46</text>
      <rect x="216" y="542" width="196" height="44" rx="14" fill="#1A222C"/><text x="231" y="569" fill="#FFF" font-size="14.5">One more thought…</text><text x="370" y="579" fill="#8A96A0" font-size="9.5">8:47</text>
      <rect x="112" y="594" width="300" height="100" rx="14" fill="#1A222C"/><text x="127" y="620" fill="#FFF" font-size="14.5">At 160% type, let the metadata move</text><text x="127" y="641" fill="#FFF" font-size="14.5">to its own line. Never make the message</text><text x="127" y="662" fill="#FFF" font-size="14.5">smaller just to preserve a tidy bubble.</text><text x="127" y="683" fill="#FFF" font-size="14.5">Content wins.</text><text x="370" y="686" fill="#8A96A0" font-size="9.5">8:48</text>
      <rect x="18" y="702" width="116" height="44" rx="14" fill="#151B23"/><text x="32" y="729" fill="#FFF" font-size="14.5">Absolutely.</text><text x="96" y="739" fill="#8A96A0" font-size="9.5">8:49</text>
    </g>
    <rect x="0" y="790" width="430" height="166" fill="#090D13" fill-opacity=".94"/><rect x="12" y="812" width="406" height="58" rx="19" fill="#151B23"/><path d="M42 831v20M32 841h20" stroke="#AEB8C0" stroke-width="2"/><text x="68" y="847" fill="#8A96A0" font-family="-apple-system,Arial" font-size="14.5">Write a message…</text><circle cx="383" cy="841" r="20" fill="none" stroke="#7CC8F5" stroke-width="1.5"/><rect x="151" y="930" width="128" height="5" rx="3" fill="#F3F6F8" fill-opacity=".72"/>
