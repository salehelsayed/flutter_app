  - Begin identity creation.
  - Interrupt the process while generating or saving.
  - Restart and inspect the recoverable startup state.
  conditions:
    platform: shared Android/iOS logic; host evidence only
    connectivity: n/a
    offline: n/a
    app_state: creation interrupted/relaunch
    input: as described
    recovery: partial generation or save
