journeys:
- id: IDENTITY-001
  feature: IDENTITY
  title: Create identity and reach first-time home without duplicate creation
  steps:
  - Open the new-user choice.
  - Tap create repeatedly while generation is pending.
  - Observe progress and successful handoff.
  conditions:
    platform: shared Android/iOS logic; host evidence only
    connectivity: n/a
    offline: n/a
    app_state: foreground
    input: as described
    recovery: n/a
  expected: One identity creation reaches the first-time app handoff after a visible progress frame.
  rating: partial
  tests:
  - path: test/features/identity/presentation/screens/identity_choice_wired_test.dart
    name: successful generation hands off to main from the progress route context
    kind: widget
    real:
    - identity choice/progress widgets
    - generation use case
    - Navigator
    faked:
    - identity/ML-KEM bridge callbacks
    - identity repository
    - main replaced by first-time setup stand-in
    proves: 'test/features/identity/presentation/screens/identity_choice_wired_test.dart:251: A successful callback
      saves the fixture identity and navigates from the progress context; not the real native identity/storage/onboarding
      chain. Registered: affected-identity, host-all.'
  - path: test/features/identity/presentation/screens/identity_choice_wired_test.dart
    name: repeated taps while generation is in flight do not push a second progress route
    kind: widget
    real:
    - real generation guard and progress route
    faked:
    - pending bridge callback
    - repository
    proves: 'test/features/identity/presentation/screens/identity_choice_wired_test.dart:360: Repeated taps produce
      one progress route and one generation operation. Registered: affected-identity, host-all.'
  - path: test/features/identity/presentation/screens/identity_choice_wired_test.dart
    name: identity generation waits until after the pushed progress route gets a frame
    kind: widget
    real:
    - real widget frame and progress route
    faked:
    - generation/ML-KEM callbacks
    - repository
    proves: 'test/features/identity/presentation/screens/identity_choice_wired_test.dart:103: Generation starts
      after the progress route has rendered; this is not process-death recovery. Registered: affected-identity,
      host-all.'
  execution: not_run
  gaps:
  - No single assertion joins actual native entropy/ML-KEM, durable secure storage and the real first-time home.
  catalog_ids:
  - RG-002
  open_questions: []
