    cancel action.
  rating: partial
  tests:
  - path: test/features/identity/presentation/screens/identity_choice_wired_test.dart
    name: identity generation waits until after the pushed progress route gets a frame
    kind: widget
    real:
    - real widget frame and progress route
    faked:
    - generation/ML-KEM callbacks
    - repository
    proves: 'test/features/identity/presentation/screens/identity_choice_wired_test.dart:103: Generation starts
      after the progress route has rendered; this is not process-death recovery. Registered: affected-identity,
      host-all.'
  - path: test/core/bootstrap/application_bootstrap_test.dart
    name: intentional startup cancellation launches no completed app
    kind: unit
    real:
    - bootstrap cancellation control flow
    faked:
    - bootstrap throwing ApplicationBootstrapCancelled
