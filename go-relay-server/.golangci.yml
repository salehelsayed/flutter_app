# golangci-lint v2 config — https://golangci-lint.run
# Invoked by `make lint` as:
#   golangci-lint run --new-from-rev=$(LINT_BASE) ./...   (LINT_BASE default HEAD)
# Only code changed since LINT_BASE is reported, so the existing large files (inbox.go ~1731,
# backend_redis.go ~1035) and the new-orbit-vs-main delta are not flooded — linters apply to
# FDC-introduced code. Do NOT base LINT_BASE on `main` (new-orbit is far ahead of it).
version: "2"

linters:
  default: none
  enable:
    - errcheck     # unchecked errors  -> "Error handling & idioms" row
    - errorlint    # %w wrapping / errors.Is/As correctness
    - govet        # superset of `go vet`
    - ineffassign  # ineffective assignments
    - revive       # exported-symbol DOC COMMENTS + naming  -> "Naming & exported API" row
    - staticcheck  # standard static-analysis suite
    - funlen       # function length  -> "File/function size" row
    - gocyclo      # cyclomatic complexity  -> god-function pressure
  settings:
    funlen:
      lines: 100
      statements: 60
    gocyclo:
      min-complexity: 25
    revive:
      rules:
        - name: exported
  exclusions:
    presets:
      - common-false-positives  # deferred Close()/Remove(), etc.
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - funlen
          - gocyclo
